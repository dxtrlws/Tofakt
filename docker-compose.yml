services:
  watchlog:
    image: ghcr.io/dxtrlws/watchlog:latest
    build:
      context: .
      args:
        WATCHLOG_BUILD: ${WATCHLOG_BUILD:-dev}
    ports:
      - "9477:9477"
    environment:
      TZ: UTC
      DATABASE_PATH: /data/watchlog.db
    volumes:
      - watchlog-data:/data
    restart: unless-stopped

volumes:
  watchlog-data:
